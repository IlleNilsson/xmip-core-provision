# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-provision"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-provision"
description = "Certificate provisioning: a source obtains and renews a node's certificate for a purpose, renewed at two thirds of its life (ADR-0034)."
publish = false

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
# The settings shape every technology declares its configuration in, and the
# one reading of it (ADR-0044, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# X.690, written and read once for the estate: the CSR and the certificate
# are DER.
asn1 = { package = "xmip-core-library-asn1", git = "https://github.com/IlleNilsson/xmip-core-library-asn1", branch = "main" }
# Base64 for PEM, the civil calendar for a certificate's times, and the
# estate's one random source for a serial number.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The crypto xmip-core-library-tls already builds (rustls's default
# provider): P-256 keys and their ECDSA signatures, SHA-256. Its assembler
# comes prebuilt, so a Windows build needs no NASM.
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
# A private key's bytes are overwritten when they are dropped.
zeroize = "1"
# The key home: every key and identity this capability and its technologies
# keep on disk is a private file (secret::private_file), owner-only before
# its first byte, synced and switched whole — written there, once.
secret = { package = "xmip-core-secret", git = "https://github.com/IlleNilsson/xmip-core-secret", branch = "main" }

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
