[package]
name = "xmip-core-provision"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-provision"
description = "Certificate provisioning: a source obtains and renews a node's certificate for a purpose, renewed at two thirds of its life (ADR-0034)."
publish.workspace = true

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
# The settings shape every technology declares its configuration in, and the
# one reading of it (ADR-0044, amendment 2026-09-26); and the one clock
# (xcore::Clock) a provisioner renews by.
xcore = { workspace = true }
# X.690, written and read once for the estate: the CSR and the certificate
# are DER.
asn1 = { workspace = true }
# PEM, the civil calendar for a certificate's times, SHA-256 for a key
# identifier and a fingerprint, and the estate's one random source for a
# serial number.
codec = { workspace = true }
# The estate's one certificate reader (`tls::certificate`): what this
# capability writes it reads back there — a certificate, a request's
# subject and names, a time, a key — and a P-256 signature is checked there.
tls = { workspace = true }
# The crypto xmip-core-library-tls already builds (rustls's default
# provider): P-256 keys and their ECDSA signatures. Its assembler comes
# prebuilt, so a Windows build needs no NASM.
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
# A private key's bytes are overwritten when they are dropped.
zeroize = "1"
# The key home: every key and identity this capability and its technologies
# keep on disk is a private file (secret::private_file), owner-only before
# its first byte, synced and switched whole — written there, once.
secret = { workspace = true }
# JOSE, the estate's one copy: the key pair signs a JWS as ES256 through its
# `SigningKey` (an ACME account's requests), and this crate's error takes the
# library's failures with `From`. Its keys stay off here.
jose = { workspace = true }

[dev-dependencies]
# The key pair's ES256 signature checked by the library's key, as an ACME
# server checks an account's.
jose = { workspace = true, features = ["key"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
